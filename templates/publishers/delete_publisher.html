{% extends 'base.html' %}

{% block title %}Delete Publisher - BoardGameHub{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-body">
                <h2 class="card-title mb-4 text-center text-danger">🗑️ Delete Publisher</h2>
                <p class="text-center text-muted mb-4">Are you sure you want to delete this publisher?</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-danger">Confirm Delete</button>
                        <a href="{% url 'publisher_details' publisher.pk %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
