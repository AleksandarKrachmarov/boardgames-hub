{% extends 'base.html' %}

{% block title %}{{ category.name }} - BoardGameHub{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="card-title text-primary mb-3">{{ category.name }}</h2>

                <p class="card-text fs-5">
                    <strong>Description:</strong><br>
                    <span class="text-muted">{{ category.description|default:"No description provided." }}</span>
                </p>

                <hr class="my-4">

                <div class="d-flex justify-content-between align-items-center">
                    <a href="{% url 'categories_list' %}" class="btn btn-outline-secondary">
                        ← Back to Categories
                    </a>
                    <div>
                        <a href="{% url 'edit_category' category.pk %}" class="btn btn-warning me-2">
                            ✏️ Edit
                        </a>
                        <a href="{% url 'delete_category' category.pk %}" class="btn btn-danger">
                            🗑️ Delete
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
